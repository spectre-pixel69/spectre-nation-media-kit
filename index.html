<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="responsive">
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:760px){
header{padding:12px 14px 20px}.brand{gap:12px}.logo{height:64px}h1{font-size:22px}
main{padding:12px 10px}
.bar{gap:8px}.bar>span[style*="flex:1"]{display:none}.bar button{flex:1 1 auto}
.hero,.cards{grid-template-columns:1fr!important}
.grid{grid-template-columns:minmax(0,1fr)!important}
.card{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px}
.card table{min-width:560px}
.grid>*{min-width:0}
svg{max-width:100%}
.form input{width:100%}
}

html.mobile-mode header{padding:12px 14px 20px}
html.mobile-mode .brand{gap:12px}
html.mobile-mode .logo{height:64px}
html.mobile-mode h1{font-size:22px}
html.mobile-mode main{padding:12px 10px}
html.mobile-mode .bar{gap:8px}
html.mobile-mode .bar>span[style*="flex:1"]{display:none}
html.mobile-mode .bar button{flex:1 1 auto}
html.mobile-mode .hero,html.mobile-mode .cards{grid-template-columns:1fr!important}
html.mobile-mode .grid{grid-template-columns:minmax(0,1fr)!important}
html.mobile-mode .card{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px}
html.mobile-mode .card table{min-width:560px}
html.mobile-mode .grid>*{min-width:0}
html.mobile-mode svg{max-width:100%}
html.mobile-mode .form input{width:100%}
html.mobile-mode #mmbtn{outline:2px solid currentColor}
</style>
<title>Spectre Nation Daily Views</title>
<style>
:root{--navy:#000917;--gold:#b27a45;--cream:#eed1a3;--brown:#7a3c20;--red:#b22234;--bg:#f7f4ef;--pn:#fff;--ln:#e4dccf;--tx:#000917;--mu:#5f5a52;--ac:#b22234;--gr:#1e7b3c;--rd:#b22234;--ru:#6b8e23;--tw:#6b3fa0;--x:#000917;--pi:#b27a45;--ki:#2a9d8f;--xl:#000917}
.ep{display:block;font-size:11px;color:var(--brown);font-weight:700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3,.kpi .l{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.06em}
header{background:#fff;border-bottom:5px solid var(--gold);box-shadow:inset 0 -9px 0 var(--red);padding:16px 28px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:center;gap:20px}.logo{height:100px;width:auto;flex:none}
h1{margin:0;font-size:30px;font-weight:700;color:var(--navy)}.wm1{color:var(--navy)}.wm2{color:var(--gold)}.sub{color:var(--mu);font-size:13px;margin-top:4px}
.live{background:var(--red);color:#fff;padding:3px 9px;border-radius:3px;font-weight:700;font-size:12px;margin-right:8px}#thru{font-family:Georgia,serif;color:var(--brown);font-weight:700}
main{padding:20px 28px;max-width:1400px;margin:auto}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--gold);padding:10px 14px;border-radius:8px;margin-bottom:14px}
input,button{background:#fff;color:var(--tx);border:1px solid #cdbfa8;border-radius:4px;padding:5px 8px;font:inherit}button{cursor:pointer;border-color:var(--gold)}button:hover{background:#fbf3e6}button.pri{background:var(--navy);color:var(--cream);border-color:var(--navy)}
input[type=checkbox]{accent-color:var(--gold)}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.kpi{background:var(--pn);border:1px solid var(--ln);border-top:4px solid var(--gold);border-radius:8px;padding:14px 18px}
.hero .kpi{border-top:4px solid var(--navy);background:#fffdf9}
.kpi .l{color:var(--brown);font-size:12px;font-weight:700}.kpi .v{font-size:30px;font-weight:700;margin:4px 0;font-family:Georgia,serif;color:var(--navy)}.hero .big .v{font-size:38px}.up{color:var(--gr)}.dn{color:var(--rd)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.cards .kpi .v{font-size:26px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:14px;overflow-x:auto}.card h2{margin:0 0 12px;font-size:17px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--cream);padding-bottom:6px}.card h2:before{content:"★ ";color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(620px,1fr));gap:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:700;background:#f6f1e8}tr.we td{color:#a39a8c}tfoot td{font-weight:700;border-top:2px solid var(--gold)}
td[title]{cursor:help;text-decoration:underline dotted #cdbfa8}.chip{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:3px;padding:0 4px;margin:0 1px}
.legend span{margin-right:14px}.sw{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}.note{color:var(--mu);font-size:12px;margin:6px 0}.snap{font-size:12px;color:var(--mu)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}.form input{width:110px}
svg text{fill:var(--mu);font-size:11px}#ctip{border-color:var(--gold)!important}
</style></head><body>
