<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Spectre Nation — X Scoreboard</title>
<style>
:root{--navy:#000917;--gold:#b27a45;--cream:#eed1a3;--rust:#7a3c20;--red:#b22234;--bg:#fbf7f0;--card:#fff;--muted:#6b6257;--line:#e8dcc8}
*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .4em}
header{background:#fff;border-bottom:4px solid var(--gold);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:58px}header h1{font-size:1.6rem}header .sub{color:var(--muted);font-size:.9rem}
.flag{height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,#fff 24px 48px)}
main{max-width:1150px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:1.2rem;color:var(--navy)}.card h2 small{font-family:inherit;color:var(--muted);font-weight:400;font-size:.8rem}
.big{font-family:Georgia,serif;font-size:2.4rem;font-weight:700;color:var(--rust)}
.bar{position:relative;height:22px;background:#f3e6cf;border-radius:11px;margin:28px 0 34px;border:1px solid var(--cream)}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--rust));border-radius:11px}
.ms{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--navy)}
.ms span{position:absolute;top:30px;transform:translateX(-50%);font-size:.72rem;white-space:nowrap;color:var(--muted)}
.ms b{position:absolute;top:-20px;transform:translateX(-50%);font-size:.75rem}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:600;font-size:.85rem}
.ok{background:#e3f1e3;color:#1d5c1d}.bad{background:#fbe3e3;color:var(--red)}.miss{background:#fbe3e3;color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#faf3e6;font-family:Georgia,serif;color:var(--rust)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;max-height:440px;overflow-y:auto}
.empty{color:var(--muted);font-style:italic;padding:10px;background:#faf6ee;border:1px dashed var(--cream);border-radius:8px}
.post{border-left:4px solid var(--gold);padding:6px 10px;margin:8px 0;background:#fdfaf4}.post.dead{border-color:var(--red)}
.post .m{font-size:.8rem;color:var(--muted)}a{color:var(--rust)}
svg text{font-family:inherit;fill:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
#err{display:none;margin:16px;padding:12px;background:#fbe3e3;color:var(--red);border-radius:8px}
</style></head><body>

<div><h1>Spectre Nation — X Scoreboard</h1><div class="sub"><a href="https://x.com/SpectreNation1" target="_blank">@SpectreNation1</a> · Last updated: <b id="upd">loading…</b> · auto-refresh 5 min</div></div></header>

<script>
const DATA_URL='https://raw.githubusercontent.com/spectre-pixel69/spectre-nation-media-kit/main/scoreboard-data.json';
const TZ='America/Los_Angeles';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null||n===''?'—':Number(n).toLocaleString('en-US');
const ptDay=iso=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
const ptHour=iso=>+new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hour12:false}).format(new Date(iso))%24;
const ptTime=iso=>new Date(iso).toLocaleString('en-US',{timeZone:TZ,month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT';
const hr=h=>((h%12)||12)+(h<12?' AM':' PM');
const empty=t=>`<div class="empty">${t}</div>`;
const card=(t,b,w)=>`<section class="card${w?' wide':''}"><h2>${t}</h2>${b}</section>`;
function bars(rows,lab,val,color){ if(!rows.length)return'';const W=Math.max(320,rows.length*46),H=180,max=Math.max(1,...rows.map(val)),bw=W/rows.length;
 return `<svg viewBox="0 0 ${W} ${H+34}" width="100%" style="max-height:230px">${rows.map((r,i)=>{const h=val(r)/max*H;return `<rect x="${i*bw+6}" y="${H-h+14}" width="${bw-12}" height="${h}" rx="3" fill="${color}"/><text x="${i*bw+bw/2}" y="${H-h+10}" font-size="11" text-anchor="middle">${fmt(val(r))}</text><text x="${i*bw+bw/2}" y="${H+30}" font-size="11" text-anchor="middle">${esc(lab(r))}</text>`}).join('')}</svg>`;}
function render(d){
 const posts=(d.posts||[]).filter(p=>p.created_at);const F=d.followers||{};const now=new Date();
 document.getElementById('upd').textContent=d.last_updated?ptTime(d.last_updated):'—';
 let h='';
 // 1 followers
 if(F.current!=null){const goal=F.goal||10000,ms=(F.milestones||[]).filter(m=>m.count<goal);
  const s=F.start||{count:F.current,date:ptDay(now)},sd=new Date(s.date+'T00:00:00-08:00'),gd=new Date((F.goal_date||'2026-12-31')+'T23:59:59-08:00');
  const frac=Math.min(1,Math.max(0,(now-sd)/(gd-sd))),need=Math.round(s.count+(goal-s.count)*frac);
  const next=(F.milestones||[]).find(m=>m.count>F.current);const daysLeft=next?Math.max(0,Math.ceil((new Date(next.date+'T23:59:59-08:00')-now)/864e5)):0;
  const perDay=next?Math.ceil((next.count-F.current)/Math.max(1,daysLeft)):0;const on=F.current>=need;
  h+=card('Followers vs goal <small>10,000 by Dec 31, 2026</small>',`<div class="big">${fmt(F.current)} <small style="font-size:1rem;color:var(--muted)">/ ${fmt(goal)}</small></div>
  <span class="pill ${on?'ok':'bad'}">${on?'ON PACE':'BEHIND PACE'}</span> <span class="pill" style="background:#faf3e6">Linear pace today: ${fmt(need)}</span>
  <div class="bar"><div class="fill" style="width:${(F.current/goal*100).toFixed(2)}%"></div>${ms.map(m=>`<div class="ms" style="left:${m.count/goal*100}%"><b>${fmt(m.count)}</b><span>${new Date(m.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>`).join('')}</div>
  ${next?`<div>Next milestone <b>${fmt(next.count)}</b> by <b>${next.date}</b>: need <b>${fmt(next.count-F.current)}</b> more in ${daysLeft} days ≈ <b>${fmt(perDay)}/day</b>.</div>`:''}
  <div class="m" style="color:var(--muted);font-size:.8rem;margin-top:6px">As of ${F.as_of?ptTime(F.as_of):'—'} · ${(F.history||[]).length} snapshot(s) in history</div>`,true);
 } else h+=card('Followers vs goal',empty('No follower count yet.'),true);
 // 2 per day
 const days={};posts.forEach(p=>{const k=ptDay(p.created_at);(days[k]=days[k]||{day:k,posts:0,imp:0,replies:0,has:false});days[k].posts++;if(p.type==='reply')days[k].replies++;if(p.impressions!=null){days[k].imp+=p.impressions;days[k].has=true}});
 const dr=Object.values(days).sort((a,b)=>a.day<b.day?-1:1);
 h+=card('Posts &amp; impressions per day <small>PT, impressions = current lifetime total of that day\'s posts</small>',dr.length?bars(dr,r=>r.day.slice(5),r=>r.imp,'#b27a45')+`<div class="scroll"><table><tr><th>Day (PT)</th><th class="n">Posts</th><th class="n">Impressions</th><th class="n">Avg / post</th></tr>${dr.slice().reverse().map(r=>`<tr><td>${r.day}</td><td class="n">${r.posts}</td><td class="n">${r.has?fmt(r.imp):'—'}</td><td class="n">${r.has?fmt(Math.round(r.imp/r.posts)):'—'}</td></tr>`).join('')}</table></div>`:empty('No posts recorded yet.'),true);
 // 3 top & dead
 const wi=posts.filter(p=>p.impressions!=null&&p.type!=='reply'&&(now-new Date(p.created_at))>6*36e5);
 const srt=wi.slice().sort((a,b)=>b.impressions-a.impressions);
 const pc=(p,dead)=>`<div class="post${dead?' dead':''}"><div>${esc(p.text).slice(0,140)}</div><div class="m">${ptTime(p.created_at)} · ${esc(p.type)} · <b>${fmt(p.impressions)}</b> impr · ${fmt(p.likes)} likes · ${fmt(p.replies)} replies · ${fmt(p.reposts)} reposts · <a href="${esc(p.url)}" target="_blank">open</a></div></div>`;
 h+=card('Top 3 posts',srt.length?srt.slice(0,3).map(p=>pc(p)).join(''):empty('No impression data yet.'));
 h+=card('Posts that died <small>lowest 3, older than 6h</small>',srt.length>3?srt.slice(-3).reverse().map(p=>pc(p,1)).join(''):empty('Not enough data yet.'));
 // 4 by type
 const ty={};posts.forEach(p=>{const t=p.type||'other';(ty[t]=ty[t]||{t,n:0,imp:0,eng:0});ty[t].n++;ty[t].imp+=p.impressions||0;ty[t].eng+=(p.likes||0)+(p.replies||0)+(p.reposts||0)+(p.quotes||0)+(p.bookmarks||0)});
 const tr=Object.values(ty).sort((a,b)=>b.imp/b.n-a.imp/a.n);
 h+=card('Results by post type',tr.length?`<table><tr><th>Type</th><th class="n">Posts</th><th class="n">Impr.</th><th class="n">Avg impr.</th><th class="n">Engagements</th></tr>${tr.map(r=>`<tr><td>${esc(r.t)}</td><td class="n">${r.n}</td><td class="n">${fmt(r.imp)}</td><td class="n">${fmt(Math.round(r.imp/r.n))}</td><td class="n">${fmt(r.eng)}</td></tr>`).join('')}</table>`:empty('No posts yet.'));
 // 5 hours
 const hb={};wi.forEach(p=>{const k=ptHour(p.created_at);(hb[k]=hb[k]||{h:k,n:0,imp:0});hb[k].n++;hb[k].imp+=p.impressions});
 const hr_=Object.values(hb).sort((a,b)=>a.h-b.h);const best=hr_.slice().sort((a,b)=>b.imp/b.n-a.imp/a.n).slice(0,3);
 h+=card('Best posting hours <small>PT, avg impressions per post</small>',hr_.length?`<div>Best: ${best.map(b=>`<span class="pill ok">${hr(b.h)} · ${fmt(Math.round(b.imp/b.n))}</span>`).join(' ')}</div>`+bars(hr_,r=>hr(r.h).replace(' ',''),r=>Math.round(r.imp/r.n),'#7a3c20'):empty('No data yet.'));
 // 6 replies
 const tgt=d.replies_target_per_day||20;const today=ptDay(now);const rt=(days[today]||{}).replies||0;
 h+=card(`Replies vs target <small>${tgt}/day</small>`,`<div class="big">${rt} <small style="font-size:1rem;color:var(--muted)">/ ${tgt} today</small></div><div class="bar" style="margin:10px 0"><div class="fill" style="width:${Math.min(100,rt/tgt*100)}%"></div></div>
 <table><tr><th>Day (PT)</th><th class="n">Replies</th><th class="n">vs ${tgt}</th></tr>${dr.slice().reverse().map(r=>`<tr><td>${r.day}</td><td class="n">${r.replies}</td><td class="n"><span class="pill ${r.replies>=tgt?'ok':'bad'}">${r.replies-tgt>=0?'+':''}${r.replies-tgt}</span></td></tr>`).join('')}</table>
 <div style="color:var(--muted);font-size:.8rem;margin-top:6px">Counts replies found in the account's post timeline.</div>`);
 // 7 bot log
 const bl=(d.bot_log||[]).slice().sort((a,b)=>a.time<b.time?1:-1);
 h+=card('X Growth Bot output log',bl.length?`<div class="scroll"><table><tr><th>Time (PT)</th><th>Type</th><th>Post</th><th>Status</th></tr>${bl.map(e=>`<tr><td>${ptTime(e.time)}</td><td>${esc(e.type)}</td><td>${esc(e.text).slice(0,120)} ${e.url?`<a href="${esc(e.url)}" target="_blank">link</a>`:''}</td><td>${esc(e.status||'posted')}</td></tr>`).join('')}</table></div>`:empty('No bot posts logged yet. Entries appear here as the X Growth Bot posts.'),true);
 // 8 live shows
 const ls=(d.live_shows||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
 h+=card('Live show stats <small>manual, from screenshots</small>',ls.length?`<div class="scroll"><table><tr><th>Date</th><th>Platform</th><th class="n">Peak</th><th class="n">Avg</th><th class="n">Views</th><th class="n">Min</th><th>Notes</th></tr>${ls.map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.platform)}</td><td class="n">${fmt(s.peak_viewers)}</td><td class="n">${fmt(s.avg_viewers)}</td><td class="n">${fmt(s.total_views)}</td><td class="n">${fmt(s.duration_min)}</td><td>${esc(s.notes)}</td></tr>`).join('')}</table></div>`:empty('No live show stats entered yet. Send a screenshot to add one.'));
 // 9 not connected
